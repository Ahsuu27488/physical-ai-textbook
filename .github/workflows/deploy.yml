name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # or master, depending on your default branch
  pull_request:
    branches:
      - main  # or master

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # One canonical site (D-028): Vercel serves the course; Pages only redirects there, page by page,
      # so the two copies don't compete in search results.
      - name: Build website
        working-directory: frontend
        run: npm ci && npm run build

      - name: Make the redirect site
        working-directory: frontend
        run: node scripts/make-redirects.mjs build pages-redirect https://physical-ai-textbook-puce-two.vercel.app /physical-ai-textbook/

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'  # Only deploy from main branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/pages-redirect
          # The following lines assign commit authorship to the official
          # GH-Actions bot for deploys from the main branch
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com